\* The chip on its own, driven by an arbitrary bus master.
\*
\* This configuration exists so that a chip-model defect is distinguishable
\* from a driver defect.  Without it, every counterexample from
\* Tmp108Driver.cfg would be ambiguous about which side is wrong.
\*
\* The temperature scale is abstract and non-negative; see the comment in
\* Tmp108Hw.tla.  The span is chosen so that a limit window plus a
\* 4-degree hysteresis band fits strictly inside it, so the comparator
\* latch is exercised rather than clipped at the domain edge.
\*
\* TestConfigWords varies each decoded field independently while holding CR
\* and POL fixed.  Neither influences any behaviour this module models --
\* CR only sets a delay, and time is not modelled; POL only inverts the pin
\* level, which no invariant here inspects -- so varying them would multiply
\* the state space by eight for no coverage.  Tmp108Codec checks the field
\* encodings of both over all 65,536 words.
\*
\*   mode + tm*4 + cr*32 + hys*4096 + pol*32768, with cr=1 (1 Hz), pol=0
\*     4128..4131  tm=0 (comparator), hys=1C, mode 0..3
\*     4132..4135  tm=1 (interrupt),  hys=1C, mode 0..3
\*        34       tm=0, hys=0C, continuous  -- degenerate band
\*     12322       tm=0, hys=4C, continuous  -- widest band

SPECIFICATION HwSpec

CONSTANTS
    MinTemp        = 0
    MaxTemp        = 5
    PorTempReg     = 0
    PorConfigWord  = 4130          \* 0x1022, the datasheet documented reset value
    WritableLimits = { 1, 4 }
    TestConfigWords = { 4128, 4129, 4130, 4131, 4132, 4133, 4134, 4135, 34, 12322 }

INVARIANTS
    HwTypeOK
    AlertMatchesFlags
    ReservedBitsAreZero
    ComparatorQuiescent

PROPERTIES
    OneShotReturnsToShutdown
