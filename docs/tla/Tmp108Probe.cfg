\* FALSIFICATION TEST -- THIS CONFIGURATION IS EXPECTED TO FAIL.
\*
\* Finding 1.  probe() is src/lib.rs:1769:
\*
\*     Ok(u16::from_le_bytes(raw) == 0x1022)
\*
\* The comparison word is hardcoded, but the part's reset value is not a
\* constant of the device family.  datasheet.txt:880 says plainly:
\*
\*     "Other options for the default values are available by request."
\*
\* Measurement E7 found exactly that: writing 0x1022, issuing a general-call
\* reset (datasheet.txt:716-718) and reading back yields 0x1026 -- TM=1,
\* interrupt mode -- reproducibly, three times.  So probe() returns
\* Ok(false) on a pristine part, while its documentation (src/lib.rs:1736)
\* attributes a false result only to the part being "already reconfigured".
\*
\* This runs the SAME module as Tmp108Driver.cfg with only PorConfigWord
\* changed, which is the point: the defect is not in the model, it is the
\* gap between a hardcoded driver constant and a per-part reset value.
\*
\* scripts/check-tla.py expects a violation of ProbeDetectsPristineChip
\* specifically, so this cannot be satisfied by an unrelated failure.  When
\* probe() is fixed, this check turns red and must be updated deliberately.

SPECIFICATION Spec

CONSTANTS
    MinTemp        = 0
    MaxTemp        = 3
    PorTempReg     = 0
    PorConfigWord  = 4134          \* 0x1026, MEASURED on a real part (E7)
    WritableLimits = { 1, 2 }
    TestConfigWords = { 4130, 4134 }
    OneShotPolls   = 2
    DriverLimits   = { 1, 2 }
    DriverConfigs <- BothThermostatModes

    EnabledOps = { "probe" }

INVARIANTS
    ProbeDetectsPristineChip
