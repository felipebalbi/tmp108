\* The driver composed with the chip.
\*
\* Constants are deliberately small.  What the properties depend on is the
\* SHAPE of each protocol -- how many transactions, in what order, with what
\* left behind on each failure -- not the size of the value domain.
\*
\* OneShotPolls is 2 here, against the driver's real 8 (src/lib.rs:607).
\* NoStaleOneShot does not depend on the budget; the budget only decides
\* how many polls precede a Timeout, and two is enough to reach both the
\* "completed within budget" and "exhausted the budget" outcomes.  The deep
\* profile raises it.

SPECIFICATION Spec

CONSTANTS
    MinTemp        = 0
    MaxTemp        = 4
    PorTempReg     = 0
    PorConfigWord  = 4130          \* 0x1022, the datasheet documented reset value
    WritableLimits = { 1, 3 }
    TestConfigWords = { 4130, 4134 }
    OneShotPolls   = 2
    DriverLimits   = { 1, 3 }
    DriverConfigs <- BothThermostatModes


    EnabledOps = { "probe", "read_configuration", "temperature",
                   "configure", "shutdown",
                   "set_low_limit", "set_high_limit",
                   "one_shot", "continuous", "wait_for_alert" }

INVARIANTS
    HwTypeOK
    DriverTypeOK
    AlertMatchesFlags
    ComparatorQuiescent
    NoStaleOneShot
    ContinuousOkImpliesShutdown
    CancelledContinuousLeaks
    ProbeDetectsPristineChip

PROPERTIES
    ObligationClearedOnlyBySettlement
    ObligationOnlyFromInterrupt
