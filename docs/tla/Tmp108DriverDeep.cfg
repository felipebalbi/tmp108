\* Deep profile: wider domains and the driver's REAL one-shot poll budget.
\*
\* Not part of the quick gate.  Run with:  python scripts/check-tla.py --deep
\*
\* OneShotPolls is 8 here, matching ONE_SHOT_POLLS at src/lib.rs:607 and the
\* Rust test polling_budget_is_eight_polls_of_five_milliseconds.  The quick
\* profile uses 2, which reaches both the "completed within budget" and
\* "exhausted the budget" outcomes; this profile confirms nothing changes at
\* the real width.
\*
\* The temperature span is widened so that a 4-degree hysteresis band fits
\* strictly inside the limit window with room on both sides.

SPECIFICATION Spec

CONSTANTS
    MinTemp        = 0
    MaxTemp        = 6
    PorTempReg     = 0
    PorConfigWord  = 4130
    WritableLimits = { 1, 5 }
    TestConfigWords = { 4130, 4134, 12322 }
    OneShotPolls   = 8
    DriverLimits   = { 1, 5 }
    DriverConfigs <- BothThermostatModes

    EnabledOps = { "probe", "read_configuration", "temperature",
                   "configure", "shutdown",
                   "set_low_limit", "set_high_limit",
                   "one_shot", "continuous", "wait_for_alert" }

INVARIANTS
    HwTypeOK
    DriverTypeOK
    AlertMatchesFlags
    ComparatorQuiescent
    NoStaleOneShot
    ContinuousOkImpliesShutdown
    CancelledContinuousLeaks
    ProbeDetectsPristineChip

PROPERTIES
    ObligationClearedOnlyBySettlement
    ObligationOnlyFromInterrupt
